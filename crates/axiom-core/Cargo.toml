[package]
name = "axiom-core"
version = "0.1.0"
edition = "2021"
description = "AXIOM: one law of motion, every world between stillness and chaos (wasm core)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# No `panic = "abort"` here on purpose: with it, `cargo build --release
# --all-targets` compiles the lib twice (abort for examples, unwind for tests)
# and the two cdylib/rlib outputs collide. wasm32-unknown-unknown aborts on
# panic by itself, and scripts/build-wasm.sh also passes -C panic=abort.

# The invariant tests integrate thousands of trajectories; keep them quick.
[profile.test]
opt-level = 3
